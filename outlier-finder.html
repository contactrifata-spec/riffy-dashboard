<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Outlier Finder — Riffy</title>
<style>
  :root {
    --bg: #fcfcfc;
    --text: #32302f;
    --muted: #686664;
    --border: #e4e2e1;
    --ash: #f1f0f0;
    --input-bg: #eeece7;
    --green: #486635;
    --red: #a43d12;
    --focus: #afaaa7;
    --radius-btn: 1600px;
    --radius-input: 100px;
    --radius-card: 20px;
    --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-serif: Georgia, 'Times New Roman', serif;
    --tiktok: #010101;
    --ig: #C13584;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 16px; line-height: 1.4; letter-spacing: 0.005em; }

  nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 0 32px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-family: var(--font-serif); font-size: 20px; font-weight: 400; letter-spacing: -0.01em; color: var(--text); text-decoration: none; }
  .nav-back { font-size: 14px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .nav-back:hover { color: var(--text); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 22px; border-radius: var(--radius-btn);
    font-family: var(--font); font-size: 14px; font-weight: 500;
    letter-spacing: 0.005em; cursor: pointer; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
    text-decoration: none; transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--ash); }
  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn-primary:hover { background: #555; border-color: #555; }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-icon { padding: 8px; border-radius: 50%; min-width: 34px; min-height: 34px; justify-content: center; }

  .page { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
  .page-title { font-family: var(--font-serif); font-size: 28px; font-weight: 400; margin-bottom: 6px; }
  .page-sub { font-size: 15px; color: var(--muted); margin-bottom: 32px; }

  .card {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-card);
    padding: 28px; margin-bottom: 24px;
  }
  .card-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 16px; }

  /* PLATFORM TABS */
  .platform-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .ptab {
    padding: 7px 16px; border-radius: var(--radius-btn); font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    transition: all 0.15s;
  }
  .ptab.active-tiktok { background: #010101; color: #fff; border-color: #010101; }
  .ptab.active-instagram { background: #C13584; color: #fff; border-color: #C13584; }

  /* ADD ROW */
  .add-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .add-input {
    flex: 1; padding: 11px 18px; border-radius: var(--radius-input);
    border: 1px solid var(--border); background: var(--input-bg);
    font-family: var(--font); font-size: 14px; color: var(--text); outline: none;
    transition: border-color 0.15s;
  }
  .add-input:focus { border-color: var(--focus); }
  .add-input::placeholder { color: var(--muted); }

  /* WATCHLIST */
  .wl-empty { text-align: center; color: var(--muted); padding: 32px 0; font-size: 14px; }
  .wl-list { display: flex; flex-direction: column; gap: 2px; }

  .wl-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px; border-radius: 12px;
    transition: background 0.12s;
    position: relative;
  }
  .wl-item:hover { background: var(--ash); }
  .wl-item:hover .wl-actions { opacity: 1; pointer-events: auto; }

  .wl-avatar-wrap { position: relative; flex-shrink: 0; }
  .wl-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--ash); object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--muted); overflow: hidden;
  }
  .wl-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .wl-badge {
    position: absolute; bottom: -2px; left: -2px;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; border: 2px solid #fff;
  }
  .wl-badge.tiktok { background: #010101; color: #fff; }
  .wl-badge.instagram { background: #C13584; color: #fff; }

  .wl-info { flex: 1; min-width: 0; }
  .wl-handle { font-weight: 600; font-size: 14px; color: var(--text); }
  .wl-stats { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .wl-actions {
    display: flex; gap: 6px; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.12s;
    flex-shrink: 0;
  }
  .wl-action-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--muted); transition: all 0.12s;
  }
  .wl-action-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }
  .wl-action-btn.danger:hover { background: var(--red); border-color: var(--red); }

  .wl-footer {
    display: flex; align-items: center; gap: 10px;
    padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .wl-footer-left { flex: 1; }
  .wl-count { font-size: 12px; color: var(--muted); }

  /* DEEP DIVE VIEW */
  #deepDiveView { display: none; }
  .view-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; color: var(--muted); cursor: pointer;
    padding: 8px 0; background: none; border: none; font-family: var(--font);
  }
  .back-btn:hover { color: var(--text); }
  .view-title { font-family: var(--font-serif); font-size: 22px; font-weight: 400; flex: 1; }

  /* DATE FILTER */
  .date-filter { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .date-filter label { font-size: 13px; color: var(--muted); }
  .date-input {
    padding: 7px 14px; border-radius: var(--radius-btn);
    border: 1px solid var(--border); background: var(--input-bg);
    font-family: var(--font); font-size: 13px; color: var(--text); outline: none;
    cursor: pointer;
  }
  .date-input:focus { border-color: var(--focus); }

  /* DARK CARD (deep dive) */
  .dd-card {
    background: #111827; border-radius: var(--radius-card);
    padding: 28px; margin-bottom: 20px; color: #f9fafb;
  }
  .dd-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .dd-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: #1e293b; overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .dd-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .dd-handle { font-size: 18px; font-weight: 600; color: #f9fafb; }
  .dd-meta { font-size: 13px; color: #94a3b8; margin-top: 3px; }

  .ai-callout {
    background: #1e293b; border-left: 3px solid #818cf8; border-radius: 8px;
    padding: 14px 16px; margin-bottom: 20px;
    font-size: 14px; line-height: 1.6; color: #cbd5e1;
    font-style: italic;
  }
  .ai-callout.loading { color: #64748b; font-style: normal; }

  .stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-tile { background: #1e293b; border-radius: 12px; padding: 16px; }
  .stat-tile-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: #64748b; margin-bottom: 6px; }
  .stat-tile-value { font-size: 22px; font-weight: 700; color: #f9fafb; }
  .stat-tile-sub { font-size: 12px; color: #94a3b8; margin-top: 3px; }

  .scatter-wrap { position: relative; width: 100%; border-radius: 12px; overflow: hidden; }
  canvas#scatterCanvas { display: block; width: 100%; }

  /* OUTLIER PILLS */
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 100px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
  }
  .p1 { background: #dbeafe; color: #1e40af; }
  .p2 { background: #fef9c3; color: #854d0e; }
  .p3 { background: #ffedd5; color: #9a3412; }
  .p4 { background: #fee2e2; color: #991b1b; }

  /* RESULTS TABLE */
  .results-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; margin-bottom: 24px; }
  .results-card table { width: 100%; border-collapse: collapse; }
  .results-card th {
    padding: 12px 16px; text-align: left; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .results-card td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .results-card tr:last-child td { border-bottom: none; }
  .results-card tr:hover td { background: var(--ash); }
  .results-card a { color: var(--text); text-decoration: none; }
  .results-card a:hover { text-decoration: underline; }
  .td-title { max-width: 280px; }
  .td-title a { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
  .td-rank { font-weight: 700; color: var(--muted); width: 36px; }
  .td-views { white-space: nowrap; }
  .td-channel { white-space: nowrap; font-size: 12px; color: var(--muted); }
  .td-channel a { color: var(--muted); }
  .td-channel a:hover { color: var(--text); }

  /* OUTLIERS VIEW */
  #outliersView { display: none; }
  .period-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .period-tab {
    padding: 8px 18px; border-radius: var(--radius-btn); font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    transition: all 0.15s;
  }
  .period-tab.active { background: var(--text); color: #fff; border-color: var(--text); }

  .progress-wrap { margin-bottom: 20px; display: none; }
  .progress-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .progress-bar-bg { height: 6px; background: var(--ash); border-radius: 100px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--text); border-radius: 100px; transition: width 0.3s; }

  .no-results { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }

  /* LOADING */
  .spin {
    width: 16px; height: 16px; border: 2px solid currentColor;
    border-top-color: transparent; border-radius: 50%;
    display: inline-block; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .stat-tiles { grid-template-columns: 1fr; }
    .page { padding: 24px 16px 60px; }
    nav { padding: 0 16px; }
    .wl-footer { gap: 8px; }
  }
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">Riffy</a>
  <a href="/" class="nav-back">← Dashboard</a>
</nav>

<div class="page">
  <div class="page-title">Creator Outlier Finder</div>
  <div class="page-sub">Find breakout videos from creators you follow. Add to your watchlist and analyze.</div>

  <!-- ═══════════════════ WATCHLIST VIEW ═══════════════════ -->
  <div id="watchlistView">
    <div class="card">
      <div class="card-title">Your Watchlist</div>

      <!-- Platform Tabs -->
      <div class="platform-tabs">
        <div class="ptab active-tiktok" id="tabTikTok" onclick="setPlatform('tiktok')">TikTok</div>
        <div class="ptab" id="tabInstagram" onclick="setPlatform('instagram')">Instagram</div>
      </div>

      <!-- Add Input -->
      <div class="add-row">
        <input class="add-input" id="addInput" type="text" placeholder="@username or profile URL" />
        <button class="btn btn-primary btn-sm" onclick="addCreator()">Add</button>
      </div>

      <!-- List -->
      <div class="wl-empty" id="wlEmpty">No creators yet — add one above.</div>
      <div class="wl-list" id="wlList"></div>

      <!-- Footer -->
      <div class="wl-footer" id="wlFooter" style="display:none;">
        <div class="wl-footer-left">
          <span class="wl-count" id="wlCount"></span>
        </div>
        <button class="btn btn-sm" onclick="removeAll()">Remove all</button>
        <button class="btn btn-sm" onclick="exportCSV()" id="exportBtn">Export</button>
        <button class="btn btn-primary btn-sm" onclick="openOutliersView()">View Watchlist Outliers</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════ DEEP DIVE VIEW ═══════════════════ -->
  <div id="deepDiveView">
    <div class="view-header">
      <button class="back-btn" onclick="showWatchlist()">← Back to Watchlist</button>
      <div class="view-title" id="ddTitle"></div>
      <!-- Date filter -->
      <div class="date-filter">
        <label>From</label>
        <input type="date" class="date-input" id="ddFrom" onchange="reRenderDeepDive()" />
        <label>To</label>
        <input type="date" class="date-input" id="ddTo" onchange="reRenderDeepDive()" />
        <button class="btn btn-sm" onclick="clearDates()">All time</button>
      </div>
    </div>

    <!-- Dark analysis card -->
    <div class="dd-card" id="ddCard">
      <div class="dd-header">
        <div class="dd-avatar" id="ddAvatar"></div>
        <div>
          <div class="dd-handle" id="ddHandle"></div>
          <div class="dd-meta" id="ddMeta"></div>
        </div>
      </div>
      <div class="ai-callout loading" id="aiCallout">Generating AI insight…</div>
      <div class="stat-tiles" id="statTiles"></div>
      <div class="scatter-wrap">
        <canvas id="scatterCanvas"></canvas>
      </div>
    </div>

    <!-- Ranked table -->
    <div class="results-card" id="ddTableWrap"></div>
  </div>

  <!-- ═══════════════════ WATCHLIST OUTLIERS VIEW ═══════════════════ -->
  <div id="outliersView">
    <div class="view-header">
      <button class="back-btn" onclick="showWatchlist()">← Back to Watchlist</button>
      <div class="view-title">Watchlist Outliers</div>
    </div>

    <!-- Period tabs -->
    <div class="period-tabs">
      <div class="period-tab active" onclick="setPeriod(7, this)">Last 7 days</div>
      <div class="period-tab" onclick="setPeriod(14, this)">Last 14 days</div>
      <div class="period-tab" onclick="setPeriod(30, this)">Last 30 days</div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label" id="progressLabel">Fetching creators…</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <!-- Results -->
    <div id="outliersResult"></div>
  </div>
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const WL_KEY = 'riffy_wl4';
const CTA_RE = [
  /comment\s+below/i, /drop\s+a\s+comment/i, /let\s+me\s+know/i,
  /dm\s+(me|us)/i, /send\s+(me|us)\s+a\s+(dm|message)/i,
  /link\s+in\s+(my\s+)?bio/i, /check\s+(out\s+)?the\s+(link\s+in\s+)?bio/i,
  /save\s+this/i, /save\s+for\s+later/i,
  /follow\s+(me|us|for)/i, /follow\s+for\s+more/i,
  /shop\s+(now|the\s+link|below)/i, /get\s+yours/i, /order\s+now/i,
  /sign\s+up/i, /subscribe/i, /join\s+(now|us|the)/i,
  /tag\s+(a\s+friend|someone)/i, /share\s+this/i, /repost/i,
  /click\s+the\s+link/i, /swipe\s+up/i, /bio\s+link/i
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let platform = 'tiktok';
let watchlist = [];
let postCache = {};        // id → scored posts array
let profileCache = {};     // id → {avatar, followers, totalViews}
let activeDDId = null;
let outliersPeriod = 7;
let loadingProfiles = new Set(); // ids currently fetching profile

// ─── INIT ─────────────────────────────────────────────────────────────────────
(function init() {
  watchlist = JSON.parse(localStorage.getItem(WL_KEY) || '[]');
  // Migrate any creators missing the platform field — infer from id prefix (platform:handle)
  let migrated = false;
  watchlist = watchlist.map(c => {
    if (!c.platform) {
      migrated = true;
      return { ...c, platform: c.id && c.id.startsWith('instagram:') ? 'instagram' : 'tiktok' };
    }
    return c;
  });
  if (migrated) saveWL();
  renderWatchlist();

  // Set date defaults (from=90d ago, to=today)
  const today = new Date();
  const ago90 = new Date(today); ago90.setDate(ago90.getDate() - 90);
  document.getElementById('ddTo').value = fmtDate(today);
  document.getElementById('ddFrom').value = fmtDate(ago90);
})();

function fmtDate(d) {
  return d.toISOString().slice(0, 10);
}

// ─── PLATFORM TOGGLE ─────────────────────────────────────────────────────────
function setPlatform(p) {
  platform = p;
  document.getElementById('tabTikTok').className = 'ptab' + (p === 'tiktok' ? ' active-tiktok' : '');
  document.getElementById('tabInstagram').className = 'ptab' + (p === 'instagram' ? ' active-instagram' : '');
  document.getElementById('addInput').placeholder = p === 'tiktok' ? '@username or TikTok URL' : '@username or Instagram URL';
  renderWatchlist();
}

// ─── WATCHLIST CRUD ──────────────────────────────────────────────────────────
function saveWL() { localStorage.setItem(WL_KEY, JSON.stringify(watchlist)); }

function parseHandle(raw, plat) {
  raw = raw.trim().replace(/^@/, '');
  try {
    const u = new URL(raw.startsWith('http') ? raw : 'https://' + raw);
    const parts = u.pathname.split('/').filter(Boolean);
    if (parts.length) return parts[parts.length - 1].replace(/^@/, '');
  } catch(_) {}
  return raw.replace(/[^a-zA-Z0-9._]/g, '');
}

async function addCreator() {
  const raw = document.getElementById('addInput').value.trim();
  if (!raw) return;
  const handle = parseHandle(raw, platform);
  if (!handle) { alert('Please enter a valid username or URL.'); return; }

  const id = platform + ':' + handle.toLowerCase();
  if (watchlist.find(c => c.id === id)) {
    alert('@' + handle + ' is already in your watchlist.'); return;
  }

  const creator = { id, handle, platform, profile: { avatar: '', followers: null, totalViews: null } };
  watchlist.push(creator);
  saveWL();
  renderWatchlist();
  document.getElementById('addInput').value = '';

  // Background profile fetch
  fetchProfileBg(creator);
}

async function fetchProfileBg(creator) {
  loadingProfiles.add(creator.id);
  renderWatchlist();
  try {
    let profile;
    if (creator.platform === 'tiktok') {
      profile = await fetchTikTokProfile(creator.handle);
    } else {
      profile = await fetchInstagramProfile(creator.handle);
    }
    const c = watchlist.find(x => x.id === creator.id);
    if (c && profile) { c.profile = profile; saveWL(); }
  } catch(_) {}
  loadingProfiles.delete(creator.id);
  renderWatchlist();
}

function removeCreator(idx) {
  const c = watchlist[idx];
  if (!c) return;
  delete postCache[c.id];
  delete profileCache[c.id];
  watchlist.splice(idx, 1);
  saveWL();
  renderWatchlist();
}

function removeAll() {
  if (!confirm('Remove all creators from your watchlist?')) return;
  watchlist = [];
  postCache = {};
  profileCache = {};
  saveWL();
  renderWatchlist();
}

// ─── RENDER WATCHLIST ────────────────────────────────────────────────────────
function renderWatchlist() {
  const list = document.getElementById('wlList');
  const empty = document.getElementById('wlEmpty');
  const footer = document.getElementById('wlFooter');
  const countEl = document.getElementById('wlCount');

  const visible = watchlist.filter(c => c.platform === platform);

  if (!visible.length) {
    if (empty) {
      empty.style.display = '';
      empty.textContent = watchlist.length
        ? `No ${platform === 'tiktok' ? 'TikTok' : 'Instagram'} creators yet — add one above.`
        : 'No creators yet — add one above.';
    }
    list.innerHTML = '';
    footer.style.display = watchlist.length ? 'flex' : 'none';
    countEl.textContent = watchlist.length + ' creator' + (watchlist.length !== 1 ? 's' : '') + ' total';
    return;
  }

  if (empty) empty.style.display = 'none';
  footer.style.display = 'flex';
  countEl.textContent = watchlist.length + ' creator' + (watchlist.length !== 1 ? 's' : '') + ' total';

  list.innerHTML = visible.map(c => {
    const idx = watchlist.indexOf(c);
    const { avatar, followers, totalViews } = c.profile || {};
    const statsStr = [
      followers != null ? fmtNum(followers) + ' followers' : null,
      totalViews != null ? fmtNum(totalViews) + ' views' : null
    ].filter(Boolean).join(' · ');

    const isLoading = loadingProfiles.has(c.id);
    const avatarInner = avatar
      ? `<img src="${escHtml(avatar)}" alt="" onerror="this.style.display='none'" />`
      : isLoading
        ? `<span class="spin" style="width:18px;height:18px;border-color:var(--muted);border-top-color:transparent"></span>`
        : (c.platform === 'tiktok' ? '♪' : '◎');

    const statsLabel = isLoading
      ? 'Loading profile…'
      : (statsStr || (c.platform === 'tiktok' ? '—' : 'Click ▶ to analyze'));

    const badgeSvg = c.platform === 'tiktok'

async function fetchTikTokProfile(handle) {
  const r = await fetch('/api/rapidapi-proxy?endpoint=/user/info&uniqueId=' + encodeURIComponent(handle));
  if (!r.ok) throw new Error('Profile fetch failed');
  const j = await r.json();
  const u = j?.data?.user;
  const s = j?.data?.stats;
  if (!u) return null;
  return {
    avatar: u.avatarMedium || u.avatarThumb || '',
    followers: s?.followerCount ?? null,
    totalViews: s?.heartCount ?? null,
    videoCount: s?.videoCount ?? null
  };
}

async function fetchInstagramProfile(handle) {
  try {
    const startR = await fetch('/api/apify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ platform: 'instagram', username: handle })
    });
    if (!startR.ok) return null;
    const { runId } = await startR.json();
    for (let i = 0; i < 20; i++) {
      await sleep(3000);
      const pollR = await fetch(`/api/apify?runId=${runId}`);
      if (!pollR.ok) continue;
      const pollJ = await pollR.json();
      if (pollJ.status === 'SUCCEEDED') {
        const first = (pollJ.items || [])[0];
        if (!first) return null;
        return {
          avatar: first.profilePicUrl || '',
          followers: first.followersCount ?? null,
          totalViews: null
        };
      }
      if (pollJ.status === 'FAILED' || pollJ.status === 'ABORTED') return null;
    }
  } catch(_) {}
  return null;
}

async function fetchTikTokPosts(handle, onStatus) {
  let cursor = 0;
  let posts = [];
  let page = 0;
  onStatus && onStatus('Fetching TikTok posts…');
  while (posts.length < 200 && page < 5) {
    const r = await fetch(`/api/rapidapi-proxy?endpoint=/user/posts&uniqueId=${encodeURIComponent(handle)}&count=35&cursor=${cursor}`);
    if (!r.ok) break;
    const j = await r.json();
    const items = j?.data?.videos || j?.data?.itemList || [];
    if (!items.length) break;
    posts.push(...items.map(v => {
      const ts = v.createTime || v.create_time || v.createTimestamp || v.createtime || 0;
      const rawViews = v.stats?.playCount || v.statistics?.playCount || v.playCount || v.play_count || v.statsV2?.playCount || 0;
      return {
        id: v.id || v.video?.id,
        url: `https://www.tiktok.com/@${handle}/video/${v.id || v.video?.id}`,
        caption: v.desc || v.title || '',
        views: typeof rawViews === 'string' ? parseInt(rawViews, 10) || 0 : rawViews,
        date: ts > 0 ? new Date(ts * 1000) : new Date()
      };
    }));
    cursor = j?.data?.cursor || 0;
    if (!j?.data?.hasMore) break;
    page++;
  }
  return posts;
}

async function fetchInstagramPosts(handle, onStatus) {
  onStatus && onStatus('Starting Instagram scrape…');
  // Start Apify run
  const startR = await fetch('/api/apify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ platform: 'instagram', username: handle })
  });
  if (!startR.ok) throw new Error('Failed to start Instagram scrape');
  const { runId } = await startR.json();

  // Poll for results
  for (let i = 0; i < 30; i++) {
    await sleep(4000);
    onStatus && onStatus(`Instagram: polling… (${Math.round((i+1)/30*100)}%)`);
    const pollR = await fetch(`/api/apify?runId=${runId}`);
    if (!pollR.ok) continue;
    const pollJ = await pollR.json();
    if (pollJ.status === 'SUCCEEDED') {
      const items = pollJ.items || [];
      let profile = null;
      if (items.length) {
        const first = items[0];
        profile = {
          avatar: first.profilePicUrl || '',
          followers: first.followersCount ?? null,
          totalViews: null
        };
      }
      const posts = items.flatMap(owner =>
        (owner.latestPosts || owner.posts || [owner]).filter(p => p.videoViewCount != null || p.videoPlayCount != null || p.likesCount != null).map(p => ({
          id: p.id || p.shortCode,
          url: p.url || `https://www.instagram.com/p/${p.shortCode}/`,
          caption: p.caption || '',
          views: p.videoViewCount || p.videoPlayCount || p.videoView || p.likesCount || 0,
          date: parseIgDate(p.timestamp || p.taken_at_timestamp || p.takenAt || 0)
        }))
      );
      const totalV = posts.reduce((sum, p) => sum + p.views, 0);
      if (profile) profile.totalViews = totalV;
      return { posts, profile };
    }
    if (pollJ.status === 'FAILED' || pollJ.status === 'ABORTED') break;
  }
  return { posts: [], profile: null };
}

// Instagram timestamps can be ISO strings or Unix seconds
function parseIgDate(raw) {
  if (!raw) return new Date();
  if (typeof raw === 'string') {
    const d = new Date(raw);
    return isNaN(d.getTime()) ? new Date() : d;
  }
  // Unix timestamp — could be seconds or ms
  const ms = raw > 1e10 ? raw : raw * 1000;
  const d = new Date(ms);
  return isNaN(d.getTime()) ? new Date() : d;
}

// ─── SCORING ──────────────────────────────────────────────────────────────────
// Outlier score = post views ÷ channel average views (last 90 days, min 5 posts)
function scoreAll(posts) {
  if (!posts.length) return [];
  const now = Date.now();
  const ms90 = 90 * 24 * 60 * 60 * 1000;
  // Use trailing 90-day posts for baseline; fall back to most recent 20 if too few
  const trailing = posts.filter(p => (now - p.date.getTime()) <= ms90);
  const base = trailing.length >= 5 ? trailing : posts.slice(0, Math.max(20, posts.length));
  const validViews = base.map(p => p.views).filter(v => v > 0);
  if (!validViews.length) return posts.map(p => ({ ...p, score: 0, baseline: 0 }));
  const avg = validViews.reduce((s, v) => s + v, 0) / validViews.length;
  return posts.map(p => ({ ...p, score: avg > 0 ? p.views / avg : 0, baseline: Math.round(avg) }));
}

function filterByDays(posts, days) {
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  return posts.filter(p => p.date.getTime() >= cutoff);
}

function filterByDates(posts, from, to) {
  let result = posts;
  if (from) { const f = new Date(from).getTime(); result = result.filter(p => p.date.getTime() >= f); }
  if (to)   { const t = new Date(to).getTime() + 86400000; result = result.filter(p => p.date.getTime() <= t); }
  return result;
}

function hasCTA(caption) {
  return CTA_RE.some(r => r.test(caption));
}

function renderDeepDive(id, scored) {
  const creator = watchlist.find(c => c.id === id);
  if (!scored.length) {
    document.getElementById('aiCallout').className = 'ai-callout';
    document.getElementById('aiCallout').textContent = 'No posts found in this date range.';
    document.getElementById('statTiles').innerHTML = '';
    document.getElementById('ddTableWrap').innerHTML = '';
    return;
  }

  const sorted = [...scored].sort((a, b) => b.score - a.score);
  const topPost = sorted[0];
  const ctaCount = scored.filter(p => hasCTA(p.caption)).length;
  const ctaPct = Math.round(ctaCount / scored.length * 100);
  const allViews = scored.map(p => p.views).sort((a, b) => a - b);
  const medViews = allViews[Math.floor(allViews.length / 2)] || 1;
  const maxViews = Math.max(...scored.map(p => p.views));
  const maxMed = (maxViews / medViews).toFixed(1);
  const span = scored.length;

  // Stat tiles
  document.getElementById('statTiles').innerHTML = `
    <div class="stat-tile">
      <div class="stat-tile-label">Top Outlier Score</div>
      <div class="stat-tile-value">${topPost.score.toFixed(1)}×</div>
      <div class="stat-tile-sub">${topPost.date.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Posts with CTA</div>
      <div class="stat-tile-value">${ctaPct}%</div>
      <div class="stat-tile-sub">${ctaCount} of ${span} posts</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">Max ÷ Median Views</div>
      <div class="stat-tile-value">${maxMed}×</div>
      <div class="stat-tile-sub">${fmtNum(maxViews)} max / ${fmtNum(medViews)} median</div>
    </div>
  `;

  // Scatter
  drawDarkScatter(scored);

  // Table
  const top30 = sorted.slice(0, 30);
  document.getElementById('ddTableWrap').innerHTML = `
    <table>
      <thead><tr>
        <th>#</th><th>Outlier</th><th>Views</th><th>Title / Caption</th>
      </tr></thead>
      <tbody>
        ${top30.map((p, i) => `<tr>
          <td class="td-rank">${i+1}</td>
          <td>${pillHtml(p.score)}</td>
          <td class="td-views">${fmtNum(p.views)}</td>
          <td class="td-title"><a href="${escHtml(p.url)}" target="_blank" rel="noopener">${escHtml(p.caption.slice(0, 120) || '(no caption)')}</a></td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  // AI narrative (async, non-blocking)
  document.getElementById('aiCallout').className = 'ai-callout loading';
  document.getElementById('aiCallout').textContent = 'Generating AI insight…';
  generateAI(creator, scored, topPost.score, ctaPct, maxMed, span);
}

async function generateAI(creator, scored, topScore, ctaPct, maxMed, span) {
  try {
    const outliers2x = scored.filter(p => p.score >= 2).length;
    const prompt = `You are a concise social media analyst. In 2-3 sentences, summarize the outlier pattern for @${creator.handle} on ${creator.platform}. Data: ${span} posts analyzed, top outlier score ${topScore.toFixed(1)}×, ${outliers2x} posts at 2×+ (${Math.round(outliers2x/span*100)}%), CTA usage ${ctaPct}%, max÷avg ${maxMed}×. Focus on what makes their breakout videos work and what content pattern drives outlier performance. Be specific and insightful.`;
    const r = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 200,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!r.ok) throw new Error('API error');
    const j = await r.json();
    const text = j?.content?.[0]?.text || j?.completion || '';
    if (text && document.getElementById('aiCallout')) {
      document.getElementById('aiCallout').className = 'ai-callout';
      document.getElementById('aiCallout').textContent = text;
    }
  } catch(_) {
    if (document.getElementById('aiCallout')) {
      document.getElementById('aiCallout').className = 'ai-callout';
      document.getElementById('aiCallout').textContent = 'AI insight unavailable.';
    }
  }
}

// ─── SCATTER PLOT ─────────────────────────────────────────────────────────────
function drawDarkScatter(scored) {
  const canvas = document.getElementById('scatterCanvas');
  const W = canvas.offsetWidth || 800;
  const H = Math.round(W * 0.45);
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  const PAD = { top: 24, right: 24, bottom: 44, left: 54 };
  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top - PAD.bottom;

  // Background
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, W, H);

  if (!scored.length) return;

  const dates = scored.map(p => p.date.getTime());
  const minT = Math.min(...dates), maxT = Math.max(...dates) || minT + 1;
  const scores = scored.map(p => p.score);
  const maxS = Math.max(...scores, 1);

  // Grid lines
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const y = PAD.top + plotH - (i / yTicks) * plotH;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + plotW, y); ctx.stroke();
    const label = ((i / yTicks) * maxS).toFixed(1) + '×';
    ctx.fillStyle = '#64748b'; ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(label, PAD.left - 6, y + 4);
  }

  // 2× threshold line
  const y3 = PAD.top + plotH - (3 / maxS) * plotH;
  if (y3 >= PAD.top && y3 <= PAD.top + plotH) {
    ctx.strokeStyle = '#374151'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(PAD.left, y3); ctx.lineTo(PAD.left + plotW, y3); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#4b5563'; ctx.font = '10px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('3×', PAD.left + 4, y3 - 4);
  }

  // Dots
  const maxViews = Math.max(...scored.map(p => p.views), 1);
  scored.forEach(p => {
    const x = PAD.left + ((p.date.getTime() - minT) / (maxT - minT || 1)) * plotW;
    const y = PAD.top + plotH - (p.score / maxS) * plotH;
    const r = 4 + Math.sqrt(p.views / maxViews) * 8;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = p.score >= 2 ? 'rgba(244,114,182,0.85)' : 'rgba(96,165,250,0.6)';
    ctx.fill();
  });

  // X-axis date labels
  ctx.fillStyle = '#64748b'; ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'center';
  const xTicks = Math.min(5, scored.length);
  for (let i = 0; i <= xTicks; i++) {
    const t = minT + (i / xTicks) * (maxT - minT);
    const x = PAD.left + (i / xTicks) * plotW;
    const d = new Date(t);
    const label = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    ctx.fillText(label, x, H - 8);
  }

  // Legend
  ctx.fillStyle = 'rgba(244,114,182,0.85)'; ctx.beginPath(); ctx.arc(PAD.left + 8, PAD.top + 10, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#94a3b8'; ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('2×+ outlier', PAD.left + 18, PAD.top + 14);
  ctx.fillStyle = 'rgba(96,165,250,0.7)'; ctx.beginPath(); ctx.arc(PAD.left + 100, PAD.top + 10, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillText('below 3×', PAD.left + 110, PAD.top + 14);
}

// ─── WATCHLIST OUTLIERS VIEW ──────────────────────────────────────────────────
let outliersAbort = false;

async function openOutliersView() {
  document.getElementById('watchlistView').style.display = 'none';
  document.getElementById('deepDiveView').style.display = 'none';
  document.getElementById('outliersView').style.display = 'block';
  outliersAbort = false;
  await fetchAllAndRender();

function setPeriod(days, el) {
  outliersPeriod = days;
  document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderOutliersTable();
}

async function fetchAllAndRender() {
  if (!watchlist.length) {
    document.getElementById('outliersResult').innerHTML = '<div class="no-results">Add creators to your watchlist first.</div>';
    return;
  }

  const needed = watchlist.filter(c => !postCache[c.id]);
  const pw = document.getElementById('progressWrap');

  if (needed.length) {
    pw.style.display = 'block';
    const total = needed.length;
    for (let i = 0; i < total; i++) {
      if (outliersAbort) break;
      const c = needed[i];
      document.getElementById('progressLabel').textContent = `Fetching @${c.handle}… (${i+1}/${total})`;
      document.getElementById('progressFill').style.width = Math.round((i / total) * 100) + '%';
      try {
        let posts;
        if (c.platform === 'tiktok') {
          posts = await fetchTikTokPosts(c.handle);
        } else {
          const { posts: igPosts, profile } = await fetchInstagramPosts(c.handle);
          posts = igPosts;
          if (profile) { c.profile = profile; saveWL(); }
        }
        postCache[c.id] = scoreAll(posts);
      } catch(_) {
        postCache[c.id] = [];
      }
    }
    document.getElementById('progressFill').style.width = '100%';
    setTimeout(() => { pw.style.display = 'none'; }, 600);
  }

  renderOutliersTable();
}

function renderOutliersTable() {
  const allOutliers = [];

  watchlist.forEach(c => {
    const posts = postCache[c.id] || [];
    const inWindow = filterByDays(posts, outliersPeriod);
    inWindow.filter(p => p.score >= 2).forEach(p => {
      allOutliers.push({ ...p, creator: c });
    });
  });

  allOutliers.sort((a, b) => b.score - a.score);
  const top20 = allOutliers.slice(0, 20);

  if (!top20.length) {
    document.getElementById('outliersResult').innerHTML = `<div class="no-results">No posts with 2×+ outlier score found in the last ${outliersPeriod} days across your watchlist.</div>`;
    return;
  }

  document.getElementById('outliersResult').innerHTML = `
    <div class="results-card">
      <table>
        <thead><tr>
          <th>#</th>
          <th>Outlier</th>
          <th>Views</th>
          <th>Title / Caption</th>
          <th>Channel</th>
        </tr></thead>
        <tbody>
          ${top20.map((p, i) => {
            const c = p.creator;
            const followers = c.profile?.followers != null ? fmtNum(c.profile.followers) + ' followers' : '';
            const channelUrl = c.platform === 'tiktok'
              ? `https://www.tiktok.com/@${c.handle}`
              : `https://www.instagram.com/${c.handle}/`;
            const channelText = '@' + c.handle + (followers ? ' | ' + followers : '');
            return `<tr>
              <td class="td-rank">${i+1}</td>
              <td>${pillHtml(p.score)}</td>
              <td class="td-views">${fmtNum(p.views)}</td>
              <td class="td-title"><a href="${escHtml(p.url)}" target="_blank" rel="noopener">${escHtml(p.caption.slice(0,120) || '(no caption)')}</a></td>
              <td class="td-channel"><a href="${escHtml(channelUrl)}" target="_blank" rel="noopener">${escHtml(channelText)}</a></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

// ─── EXPORT CSV ───────────────────────────────────────────────────────────────
function exportCSV() {
  const rows = [['Creator', 'Platform', 'Outlier Score', 'Views', 'Caption', 'URL', 'Date']];
  watchlist.forEach(c => {
    const posts = postCache[c.id] || [];
    posts.filter(p => p.score >= 2).sort((a, b) => b.score - a.score).forEach(p => {
      rows.push([
        '@' + c.handle, c.platform,
        p.score.toFixed(2), p.views,
        '"' + (p.caption || '').replace(/"/g, '""').slice(0, 200) + '"',
        p.url,
        p.date.toISOString().slice(0, 10)
      ]);
    });
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'riffy-outliers.csv';
  a.click();
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function fmtNum(n) {
  if (n == null) return '';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toString();
}

function pillHtml(score) {
  let cls = 'p1', label = score.toFixed(1) + '×';
  if (score >= 10) cls = 'p4';
  else if (score >= 5) cls = 'p3';
  else if (score >= 2) cls = 'p2';
  return `<span class="pill ${cls}">${label}</span>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escId(s) {
  return String(s).replace(/[^a-zA-Z0-9_-]/g, '_');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

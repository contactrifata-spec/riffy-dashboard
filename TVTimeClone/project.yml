name: TVTimeClone

options:
  bundleIdPrefix: com.rifat
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0

targets:
  TVTimeClone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.rifat.tvtimeclone

    sources:
      - path: Sources/TVTimeClone
        name: TVTimeClone

    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Riffy
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              # Google Sign-In reversed client ID — update after you set up Google OAuth
              - $(GOOGLE_REVERSED_CLIENT_ID)
            CFBundleURLName: com.rifat.tvtimeclone.google
        NSPhotoLibraryUsageDescription: Choose a profile photo
        NSCameraUsageDescription: Take a profile photo

    entitlements:
      path: SupportingFiles/TVTimeClone.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

    dependencies:
      - package: supabase-swift
        product: Supabase
      - package: supabase-swift
        product: Auth
      - package: GoogleSignIn-iOS
        product: GoogleSignIn

    settings:
      base:
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.rifat.tvtimeclone
        # Fill in your Team ID from developer.apple.com → Account → Membership
        DEVELOPMENT_TEAM: ""
        # Fill in your Google reversed client ID after setting up OAuth
        GOOGLE_REVERSED_CLIENT_ID: "YOUR_REVERSED_CLIENT_ID"
        ENABLE_PREVIEWS: "YES"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
